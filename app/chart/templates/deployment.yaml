{{- $model := .Values.runtime.model -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diy-llm
spec:
  replicas: 1
  # There's only one GPU, so the old pod has to stop before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diy-llm
  template:
    metadata:
      labels:
        app: diy-llm
      annotations:
        checksum/otel-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: diy-llm
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 0
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          command: ["vllm", "serve"]
          args:
            - s3://{{ required "runtime.model.bucketName is required" $model.bucketName }}/models/{{ $model.name }}/{{ $model.revision }}
            - --load-format=runai_streamer
            # The streamer buffers in host memory, unbounded by default: cap it at 2 GiB
            - '--model-loader-extra-config={"memory_limit": 2147483648}'
            - --served-model-name={{ $model.name }}
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --host=0.0.0.0
            - --port=8000
            - --otlp-traces-endpoint=grpc://$(NODE_IP):4317
            - --dtype=half
            - --max-model-len=12288
            - --gpu-memory-utilization=0.95
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: diy-llm-api-key
                  key: diy-llm-api-key
            - name: AWS_REGION
              value: {{ .Values.awsRegion }}
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /cache
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: diy-llm
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(K8S_POD_UID)
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              memory: 12Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
        - name: metrics-exporter
          image: otel/opentelemetry-collector-k8s:0.160.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: diy-llm
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(K8S_POD_UID)
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: otel-config
          configMap:
            name: diy-llm-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: diy-llm
spec:
  selector:
    app: diy-llm
  ports:
    - name: http
      port: 8000
      targetPort: http