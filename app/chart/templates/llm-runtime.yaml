{{- $model := .Values.runtime.model -}}
# Terraform gives this service account read access to the model bucket
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-runtime
spec:
  replicas: 1
  # There's only one GPU, so the old pod has to stop before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-runtime
  template:
    metadata:
      labels:
        app: llm-runtime
      annotations:
        checksum/otel-config: {{ include (print $.Template.BasePath "/llm-runtime-otel-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: llm-runtime
      # Only the GPU nodes have nvidia.com/gpu to give, and they're tainted
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # The vllm user from vLLM's image
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 0
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          command: ["vllm", "serve"]
          args:
            - s3://{{ required "runtime.model.bucket is required" $model.bucket }}/models/{{ $model.name }}/{{ $model.revision }}
            # Streams the weights from S3 straight to the GPU
            - --load-format=runai_streamer
            # The streamer buffers in host memory, unbounded by default: cap it at 2 GiB
            - '--model-loader-extra-config={"memory_limit": 2147483648}'
            # Clients ask for the model by its Hugging Face name
            - --served-model-name={{ $model.name }}
            # Open WebUI sends its tools with tool_choice=auto. Qwen3 uses the hermes format.
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --host=0.0.0.0
            - --port=8000
            - --otlp-traces-endpoint=grpc://$(NODE_IP):4317
            # The T4 has no bfloat16 support and 16 GiB of memory
            - --dtype=half
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
          env:
            # Required on /v1 requests. /health and /metrics stay open.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm
                  key: vllm-api-key
            - name: AWS_REGION
              value: {{ .Values.awsRegion }}
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_CACHE_ROOT
              value: /cache
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: llm-runtime
            # Lets the collector add the pod's Kubernetes metadata
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(K8S_POD_UID)
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          # Loading the model and compiling can take several minutes
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          # g4dn.xlarge: 4 vCPUs, 16 GiB
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              memory: 12Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
        - name: metrics-exporter
          image: otel/opentelemetry-collector-k8s:0.160.0
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: llm-runtime
            # Lets the collector add the pod's Kubernetes metadata
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(K8S_POD_UID)
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
      volumes:
        # vLLM's compile cache, on the node's disk. Kept across container restarts.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: otel-config
          configMap:
            name: llm-runtime-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: llm-runtime
spec:
  selector:
    app: llm-runtime
  ports:
    - name: http
      port: 8000
      targetPort: http
