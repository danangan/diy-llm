{{- /* Generated once, then reused on upgrades so clients keep working */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "diy-llm-api-key").data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: diy-llm-api-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  diy-llm-api-key: {{ index $existing "diy-llm-api-key" | default (randAlphaNum 48 | b64enc) }}
