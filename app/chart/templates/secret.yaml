{{- /* Generated once, then reused on upgrades (a new WEBUI_SECRET_KEY would log everyone out) */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "llm").data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: llm
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  vllm-api-key: {{ index $existing "vllm-api-key" | default (randAlphaNum 48 | b64enc) }}
  webui-secret-key: {{ index $existing "webui-secret-key" | default (randAlphaNum 48 | b64enc) }}
