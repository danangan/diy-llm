
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diy-llm
  annotations:
    alb.ingress.kubernetes.io/group.name: diy-llm
    alb.ingress.kubernetes.io/certificate-arn: {{ required "api.certificateArn is required" .Values.api.certificateArn }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Long generations for coding agents
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "api.host is required" .Values.api.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: diy-llm
                port:
                  name: http